  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__top">
        <div class="footer__brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </span>
          <div>
            <strong>{{ nombre_libreria }}</strong>
            <p>{{ slogan }}</p>
          </div>
        </div>

        <div class="footer__contact">
          <a class="footer__addr" href="{{ mapa_url }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><use href="#i-pin"/></svg>
            <span>{{ direccion }}</span>
          </a>
          <a class="footer__addr" href="https://wa.me/{{ whatsapp }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><use href="#i-whatsapp"/></svg>
            <span>{{ whatsapp_display }}</span>
          </a>
          <div class="social social--dark">
            {% for r in redes %}
            <a class="social__link social__link--{{ r.icono }}" href="{{ r.url }}" target="_blank" rel="noopener" title="{{ r.nombre }}" aria-label="{{ r.nombre }}">
              <svg viewBox="0 0 24 24" fill="currentColor"><use href="#i-{{ r.icono }}"/></svg>
            </a>
            {% endfor %}
          </div>
        </div>
      </div>
      <p class="footer__copy">© {{ anio_actual }} {{ nombre_libreria }}. Todos los derechos reservados.</p>
    </div>
  </footer>
