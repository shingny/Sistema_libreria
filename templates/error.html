<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4338ca" />
  <meta name="robots" content="noindex" />
  <title>{{ codigo }} | {{ nombre_libreria }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128218;</text></svg>" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body class="errorpage">

  <header class="topbar">
    <div class="container topbar__inner">
      <a href="/" class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </span>
        <span class="brand__text">
          <strong>{{ nombre_libreria }}</strong>
          <small>{{ slogan }}</small>
        </span>
      </a>
    </div>
  </header>

  <main class="errorcard">
    <p class="errorcard__code">{{ codigo }}</p>
    <h1>{{ mensaje }}</h1>
    <p>Puedes volver al catalogo y seguir explorando nuestros libros.</p>
    <div class="errorcard__actions">
      <a class="btn btn--primary" href="/">Volver al catalogo</a>
      <a class="btn btn--wa" href="https://wa.me/{{ whatsapp }}" target="_blank" rel="noopener">Escribir por WhatsApp</a>
    </div>
  </main>

</body>
</html>
